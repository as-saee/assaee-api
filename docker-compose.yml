services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000" # local only; every route but /health needs the key
    environment:
      ASSAEE_TZ: Europe/Madrid
      ASSAEE_API_KEY: ${ASSAEE_API_KEY:?set ASSAEE_API_KEY (e.g. in a git-ignored .env file)}
      ASSAEE_NTFY_URL: http://ntfy # compose network: reach the other service by its name
    volumes:
      - assaee-data:/data

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    ports:
      - "127.0.0.1:2586:80" # local only: no auth configured yet
    environment:
      NTFY_BASE_URL: http://localhost:2586
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ntfy-cache:/var/cache/ntfy

volumes:
  assaee-data:
  ntfy-cache:
